<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donate - NayePankh Foundation</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .donation-container {
            background: white;
            max-width: 550px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInUp 0.5s ease-out;
        }
        
        .donation-container .icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .donation-container h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .donation-container p.subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }
        
        .form-group textarea {
            height: 80px;
            resize: vertical;
        }
        
        .btn-donate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-donate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.3);
        }
        
        .btn-donate:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
        }
        
        .btn-back:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 8px;
        }
        
        .quick-amount-btn {
            padding: 10px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #333;
        }
        
        .quick-amount-btn:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }
        
        .quick-amount-btn.active {
            border-color: #764ba2;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 500px) {
            .donation-container {
                padding: 25px;
            }
            
            .quick-amounts {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .donation-container h2 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="donation-container">
        <div class="icon">💝</div>
        <h2>Make a Donation</h2>
        <p class="subtitle">Your contribution helps us make a difference</p>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="donationForm">
            <div class="form-group">
                <label for="donorName">Full Name</label>
                <input type="text" id="donorName" placeholder="Enter your full name" required />
            </div>
            
            <div class="form-group">
                <label for="donorEmail">Email Address</label>
                <input type="email" id="donorEmail" placeholder="Enter your email" required />
            </div>
            
            <div class="form-group">
                <label for="donationAmount">Amount (₹)</label>
                <input type="number" id="donationAmount" placeholder="Enter amount" required min="1" />
                <div class="quick-amounts">
                    <button type="button" class="quick-amount-btn" data-amount="100">₹100</button>
                    <button type="button" class="quick-amount-btn" data-amount="500">₹500</button>
                    <button type="button" class="quick-amount-btn" data-amount="1000">₹1000</button>
                    <button type="button" class="quick-amount-btn" data-amount="5000">₹5000</button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="donationPurpose">Purpose</label>
                <select id="donationPurpose" required>
                    <option value="">Select a purpose...</option>
                    <option value="Education">📚 Education</option>
                    <option value="Health">🏥 Health</option>
                    <option value="Social Activities">🤝 Social Activities</option>
                    <option value="General">💝 General Support</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="donationMessage">Message (Optional)</label>
                <textarea id="donationMessage" placeholder="Leave a message with your donation"></textarea>
            </div>
            
            <button type="submit" class="btn-donate" id="donateBtn">Donate Now</button>
        </form>
        
        <a href="../volunteer/dashboard.html" class="btn-back">← Back to Dashboard</a>
    </div>
    
    <script type="module">
        import { db, collection, addDoc } from '../js/firebase-config.js';
        
        const form = document.getElementById('donationForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const donateBtn = document.getElementById('donateBtn');
        const amountInput = document.getElementById('donationAmount');
        
        // Check if user is logged in
        const userEmail = sessionStorage.getItem('userEmail');
        const userName = sessionStorage.getItem('userName');
        
        if (userEmail) {
            document.getElementById('donorEmail').value = userEmail;
        }
        
        if (userName) {
            document.getElementById('donorName').value = userName;
        }
        
        // Quick amount buttons
        document.querySelectorAll('.quick-amount-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = btn.dataset.amount;
                amountInput.value = amount;
                
                // Remove active class from all buttons
                document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
        
        // Remove active class when user types manually
        amountInput.addEventListener('input', () => {
            document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('active'));
        });
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            const name = document.getElementById('donorName').value.trim();
            const email = document.getElementById('donorEmail').value.trim();
            const amount = parseFloat(document.getElementById('donationAmount').value);
            const purpose = document.getElementById('donationPurpose').value;
            const message = document.getElementById('donationMessage').value.trim();
            
            if (!name || !email || !amount || !purpose) {
                showError('Please fill in all required fields.');
                return;
            }
            
            if (amount < 1) {
                showError('Please enter a valid donation amount.');
                return;
            }
            
            // Disable button and show loading
            donateBtn.disabled = true;
            donateBtn.textContent = 'Processing...';
            
            try {
                // Save donation to Firestore
                await addDoc(collection(db, 'donations'), {
                    name: name,
                    email: email,
                    amount: amount,
                    purpose: purpose,
                    message: message,
                    date: new Date().toISOString(),
                    createdAt: new Date()
                });
                
                // Show success
                showSuccess(`Thank you for your donation of ₹${amount}! 🙏 Your support makes a difference.`);
                
                // Reset form
                form.reset();
                document.querySelectorAll('.quick-amount-btn').forEach(b => b.classList.remove('active'));
                
                donateBtn.textContent = 'Donate Again';
                donateBtn.disabled = false;
                
                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = '../volunteer/dashboard.html';
                }, 3000);
                
            } catch (error) {
                console.error('Donation error:', error);
                showError('Failed to process donation. Please try again.');
                donateBtn.disabled = false;
                donateBtn.textContent = 'Donate Now';
            }
        });
        
        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
        }
        
        function showSuccess(message) {
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }
    </script>
</body>
</html>
